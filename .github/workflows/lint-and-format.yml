name: Lint and format

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Check Prettier formatting
        id: format
        run: npm run format:check
        continue-on-error: true

      - name: Report lint and format results
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
        run: |
          failed=false

          if [ "$LINT_OUTCOME" != "success" ]; then
            echo "::error title=ESLint found issues::Run npm run lint:fix locally, then commit the changes."
            failed=true
          fi

          if [ "$FORMAT_OUTCOME" != "success" ]; then
            echo "::error title=Prettier found formatting issues::Run npm run format locally, then commit the changes."
            failed=true
          fi

          if [ "$failed" = true ]; then
            exit 1
          fi
